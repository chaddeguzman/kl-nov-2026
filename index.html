a-lumpur/"}],"photo":"","photoAlt":"","category":"Travel"},{"id":"d4-s2","name":"Klook Melaka sightseeing, local lunch & river walk","when":"8:15 AM – 4:00 PM · GUIDED TOUR WINDOW / STOP TIMES SET BY GUIDE","phase":"morning","travel":"Round-trip tour transfer from Sky Suites; follow the guide’s transport and meeting instructions.","detail":"Travel to Melaka with the professional guide; the road journey is part of this tour window. Follow the operator’s actual stop order and meeting times. Individual attraction times and interior admissions have not been confirmed. The public Klook overview lists St Peter’s Church, Dutch Square, St Paul’s Hill and A’Famosa. It also advertises Sultan’s Palace Museum, a Straits Mosque photo stop and Harmony Street; these are overview stops pending the package-specific itinerary. Local lunch is included; the restaurant, menu and serving time are set by the operator. Browse daytime Jonker Street as directed by the guide. Its regular Friday–Sunday night market is outside this weekday tour. Walk beside the Melaka River. This package has no boat cruise, as confirmed by Chad. Return to the guide’s meeting point in time for the 4:00 PM departure. Do not add separate transport or sightseeing that could miss the tour.","cost":"Professional guide, local lunch and round-trip transfers included. Tour price: use the booking confirmation; personal purchases extra.","detailSteps":["Travel to Melaka with the professional guide; the road journey is part of this tour window.","Follow the operator’s actual stop order and meeting times. Individual attraction times and interior admissions have not been confirmed.","The public Klook overview lists St Peter’s Church, Dutch Square, St Paul’s Hill and A’Famosa.","It also advertises Sultan’s Palace Museum, a Straits Mosque photo stop and Harmony Street; these are overview stops pending the package-specific itinerary.","Local lunch is included; the restaurant, menu and serving time are set by the operator.","Browse daytime Jonker Street as directed by the guide. Its regular Friday–Sunday night market is outside this weekday tour.","Walk beside the Melaka River. This package has no boat cruise, as confirmed by Chad.","Return to the guide’s meeting point in time for the 4:00 PM departure. Do not add separate transport or sightseeing that could miss the tour."],"travelSteps":["Round-trip tour transfer from Sky Suites; follow the guide’s transport and meeting instructions."],"links":[{"label":"Klook tour listing","href":"https://www.klook.com/activity/1301-full-day-historical-melaka-lunch-tour-kuala-lumpur/"}],"photo":"assets/images/d4-s2.png","photoAlt":"Photo cropped from supplied itinerary image: dutch square","category":"Travel"},{"id":"d4-s3","name":"Depart Melaka at 4 PM → Kuala Lumpur around 6 PM","when":"4:00 PM – 6:00 PM · RETURN TRANSFER / EXPECTED KL ARRIVAL","phase":"afternoon","travel":"Use the included return transfer; follow the operator’s confirmed drop-off instructions.","detail":"The operator’s schedule supplied by Chad departs Melaka at 4:00 PM and returns to Kuala Lumpur at 6:00 PM. Treat 6:00 PM as the expected KL return time; traffic can delay arrival. Confirm the exact return drop-off point with the guide. KL arrival does not establish an exact Sky Suites arrival time.","cost":"Professional guide, local lunch and round-trip transfers included. Tour price: use the booking confirmation; personal purchases extra.","detailSteps":["The operator’s schedule supplied by Chad departs Melaka at 4:00 PM and returns to Kuala Lumpur at 6:00 PM.","Treat 6:00 PM as the expected KL return time; traffic can delay arrival.","Confirm the exact return drop-off point with the guide. KL arrival does not establish an exact Sky Suites arrival time."],"travelSteps":["Use the included return transfer; follow the operator’s confirmed drop-off instructions."],"links":[{"label":"Klook tour listing","href":"https://www.klook.com/activity/1301-full-day-historical-melaka-lunch-tour-kuala-lumpur/"}],"photo":"","photoAlt":"","category":"Travel"}]},{"id":"day5","date":"Thu, 3 Dec","title":"Putrajaya, Central, and Chinatown","subtitle":"Putrajaya, daylight heritage photos and a night walk ending at 8 PM.","stops":[{"id":"d5-s1","name":"Sky Suites → Conlay MRT → Putrajaya Sentral → Putra Mosque","when":"7:45 AM – 9:45 AM · WALK, MRT & GRAB","phase":"morning","travel":"Allow up to 2 hr door to door for the station walk, ticketing, MRT journey and Grab pickup.","detail":"Walk from Sky Suites KLCC to Conlay MRT (PY22) on the Yellow Putrajaya Line. Allow about 20–30 min to reach and enter the station. Board the southbound train towards Putrajaya Sentral (PY41), the final stop. Allow roughly 50–60 min on the train, plus waiting. Exit at Putrajaya Sentral and book a Grab to Putra Mosque. Allow about 15–25 min for the road trip, plus pickup.","cost":"MRT fare per adult plus a shared Grab fare. Check the rail fare and app quote before paying.","detailSteps":["Walk from Sky Suites KLCC to Conlay MRT (PY22) on the Yellow Putrajaya Line.","Allow about 20–30 min to reach and enter the station.","Board the southbound train towards Putrajaya Sentral (PY41), the final stop.","Allow roughly 50–60 min on the train, plus waiting.","Exit at Putrajaya Sentral and book a Grab to Putra Mosque.","Allow about 15–25 min for the road trip, plus pickup."],"travelSteps":["Allow up to 2 hr door to door for the station walk, ticketing, MRT journey and Grab pickup."],"links":[{"label":"Walk: Sky Suites → Conlay","href":"https://www.google.com/maps/dir/?api=1&origin=The+Sky+Suites+KLCC+by+the+Park&destination=Conlay+MRT+Station&travelmode=walking"},{"label":"MRT: Conlay → Putrajaya Sentral","href":"https://www.google.com/maps/dir/?api=1&origin=Conlay+MRT+Station&destination=Putrajaya+Sentral+MRT+Station&travelmode=transit"},{"label":"Grab: Putrajaya Sentral → mosque","href":"https://www.google.com/maps/dir/?api=1&origin=Putrajaya+Sentral&destination=Putra+Mosque+Putrajaya&travelmode
