ical-melaka-lunch-tour-kuala-lumpur/"}],"photo":"assets/images/d4-s2.png","category":"Travel","title":"Guided Melaka tour, lunch & river walk"},{"id":"d4-s3","name":"Depart Melaka at 4 PM → Kuala Lumpur around 6 PM","when":"04:00 PM - 06:00 PM","phase":"afternoon","travel":"Use the included return transfer; follow the operator’s confirmed drop-off instructions.","detail":"The operator’s schedule supplied by Chad departs Melaka at 4:00 PM and returns to Kuala Lumpur at 6:00 PM. Treat 6:00 PM as the expected KL return time; traffic can delay arrival. Confirm the exact return drop-off point with the guide. KL arrival does not establish an exact Sky Suites arrival time.","detailSteps":["The operator’s schedule supplied by Chad departs Melaka at 4:00 PM and returns to Kuala Lumpur at 6:00 PM.","Treat 6:00 PM as the expected KL return time; traffic can delay arrival.","Confirm the exact return drop-off point with the guide. KL arrival does not establish an exact Sky Suites arrival time."],"travelSteps":["Use the included return transfer; follow the operator’s confirmed drop-off instructions."],"links":[{"label":"Klook tour listing","href":"https://www.klook.com/activity/1301-full-day-historical-melaka-lunch-tour-kuala-lumpur/"}],"photo":"","category":"Travel","title":"4 PM departure · KL around 6 PM"}]},{"id":"day5","date":"Thu, 3 Dec","title":"Putrajaya, Central, and Chinatown","subtitle":"Putrajaya, daylight heritage photos and a night walk ending at 8 PM.","stops":[{"id":"d5-s1","name":"Sky Suites → Conlay MRT → Putrajaya Sentral → Putra Mosque","when":"07:45 AM - 09:45 AM","phase":"morning","travel":"Allow up to 2 hr door to door for the station walk, ticketing, MRT journey and Grab pickup.","detail":"Walk from Sky Suites KLCC to Conlay MRT (PY22) on the Yellow Putrajaya Line. Allow about 20–30 min to reach and enter the station. Board the southbound train towards Putrajaya Sentral (PY41), the final stop. Allow roughly 50–60 min on the train, plus waiting. Exit at Putrajaya Sentral and book a Grab to Putra Mosque. Allow about 15–25 min for the road trip, plus pickup.","detailSteps":["Walk from Sky Suites KLCC to Conlay MRT (PY22) on the Yellow Putrajaya Line.","Allow about 20–30 min to reach and enter the station.","Board the southbound train towards Putrajaya Sentral (PY41), the final stop.","Allow roughly 50–60 min on the train, plus waiting.","Exit at Putrajaya Sentral and book a Grab to Putra Mosque.","Allow about 15–25 min for the road trip, plus pickup."],"travelSteps":["Allow up to 2 hr door to door for the station walk, ticketing, MRT journey and Grab pickup."],"links":[{"label":"Walk: Sky Suites → Conlay","href":"https://www.google.com/maps/dir/?api=1&origin=The+Sky+Suites+KLCC+by+the+Park&destination=Conlay+MRT+Station&travelmode=walking"},{"label":"MRT: Conlay → Putrajaya Sentral","href":"https://www.google.com/maps/dir/?api=1&origin=Conlay+MRT+Station&destination=Putrajaya+Sentral+MRT+Station&travelmode=transit"},{"label":"Grab: Putrajaya Sentral → mosque","href":"https://www.google.com/maps/dir/?api=1&origin=Putrajaya+Sentral&destination=Putra+Mosque+Putrajaya&travelmode=driving"},{"label":"Conlay station / Putrajaya Line","href":"https://www.mymrt.com.my/projects/putrajaya-line/stations/conlay/"}],"photo":"","category":"Photo","title":"Conlay MRT → Putrajaya → mosque"},{"id":"d5-s2","name":"Putra Mosque / Pink Mosque and Putra Square","when":"09:45 AM - 10:45 AM","phase":"morning","travel":"The Grab ride from Putrajaya Sentral is included in the preceding travel block.","detail":"Spend up to one hour at the mosque and adjacent Putra Square, including dress preparation and photos. Follow visitor access and prayer-time restrictions. Leave by 10:45 AM for the Grab back to Putrajaya Sentral.","detailSteps":["Spend up to one hour at the mosque and adjacent Putra Square, including dress preparation and photos.","Follow visitor access and prayer-time restrictions.","Leave by 10:45 AM for the Grab back to Putrajaya Sentral
